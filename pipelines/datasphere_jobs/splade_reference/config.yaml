# DataSphere Jobs config for SPLADE re-ranking on MS MARCO dev
# See: https://yandex.cloud/en/docs/datasphere/concepts/jobs

name: splade-reranking-msmarco
desc: >
  SPLADE re-ranking pipeline on MS MARCO dev set.
  BM25 top-1000 → SPLADE re-rank → MRR@10, Recall@K evaluation.

cmd: >
  python main.py \
    --collection ${COLLECTION} \
    --max-queries 6980 \
    --batch-size 32 \
    --output ${OUTPUT_METRICS}

# Input files: collection.tar.gz is uploaded from local machine
inputs:
  - collection.tar.gz:
      var: COLLECTION

# Output files: metrics JSON is downloaded back to local machine
outputs:
  - metrics.json: OUTPUT_METRICS

# Environment
env:
  python:
    type: manual
    version: "3.10"
    requirements-file: requirements.txt

# GPU instances for fast inference (priority order)
cloud-instance-types:
  - g2.1   # 1x A100
  - g1.1   # 1x V100
